# Release curl on a version tag: a portable source package plus the udt BASIC
# HTTP seam (HTTPGET/HTTPGETFILE via curl).  udt-only, pure BASIC — no native
# build, no container — so it stages + tars on a hosted runner and is
# os/arch-independent (udt-any-any-le).  Copyright (C) 2026 Gordon Heydon.
# GPL-2.0-only.  Tag the bare version, e.g.:  git tag 1.0.0 && git push origin 1.0.0
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/curl
          title: curl
          body: "HTTP client for UniData via curl (HTTPGET, HTTPGETFILE). Source + udt seam; indexed by the package registry."

  # The udt side is a native CallC binding (mvxcurl.c -DMVXCURL_UDT -> curlcallcb.o,
  # linked against libcurl into libu2callc.so), so the object must be compiled on
  # the target's Rocky 8 — build it in the licensed udt-builder container (which
  # ships libcurl-devel) via the shared udt-build action, exactly like git.
  udt-binary:
    runs-on: [self-hosted, linux, udt]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/udt-build@main
        with:
          package: mvx-lang/curl
