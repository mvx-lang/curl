# Release curl on a version tag: the source package, plus the libcurl HTTP
# client (HTTPGET, HTTPGETFILE, HTTPPOST) built for each system that loads it --
# a UniData CallC object, a jBASE DEFC library, and an mvx native extension.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
# Tag the bare version, e.g.:  git tag 1.0.0 && git push origin 1.0.0
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      # ONE rolling dev tag, moved to the HEAD of develop by the nightly when
      # there is something new.  It builds through THIS workflow rather than
      # a second copy of it, so a dev build is the same artifacts by the same
      # steps as a release -- the only way a dev build is worth having.
      - "dev"

  # A TAG PUSHED BY A WORKFLOW DOES NOT TRIGGER ONE.  GitHub will not let the
  # default GITHUB_TOKEN start another run -- it is how recursion is prevented
  # -- so the nightly's tag lands and nothing happens.  It dispatches this
  # workflow on the tag instead, which is the same build from the same ref.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ci.yml runs this on every push and pull request, but not on a TAG -- and a
  # tag is the one push where shipping manifests that disagree is permanent.
  # json, mapfield and curl-cmd each gate their release the same way (#25).
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The manifests agree with each other
        run: |
          set -eu
          want=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                   mvpkg.json | head -1)
          [ -n "$want" ] || { echo "::error::mvpkg.json has no version"; exit 1; }
          sh tests/manifest-version.sh "$want"

  source:
    needs: [manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/curl
          artifact: curl
          title: curl
          body: "HTTP client via libcurl (HTTPGET, HTTPGETFILE, HTTPPOST) for mvx, UniData and jBASE. Source + prebuilt binaries; indexed by the package registry."

  # The udt side is a native CallC binding (mvxcurl.c -DMVXCURL_UDT -> curlcallcb.o,
  # linked against libcurl into libu2callc.so), so the object must be compiled on
  # the target's Rocky 8 — build it in the licensed udt-builder container (which
  # ships libcurl-devel) via the shared udt-build action, exactly like git.
  # needs: [source] — NOT for ordering, but so this job never CREATES the release.
  # Every publish step creates it as a side effect of uploading, so jobs starting
  # together each try to create it: one wins and the losers fail finalize with
  # `Validation Failed: {"code":"already_exists","field":"tag_name"}`, leaving a
  # stray draft release behind for the tag.  That is where the duplicate draft
  # beside every tag comes from, and on mv_package#66 it went further — the job
  # it killed was `source`, which other jobs need, so the release shipped with
  # half its artifacts.  `source` alone creates it; the rest upload into it.
  udt-binary:
    needs: [source]
    runs-on: [self-hosted, linux, udt]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/udt-build@main
        with:
          package: mvx-lang/curl
          artifact: curl

  # ---- what kind of release is this? ----------------------------------------
  # LAST, because it is correcting the publish steps rather than joining them.
  # Both of them create the release as a side effect of uploading to it, and
  # neither is told what the release is: publish-source marks a pre-release with
  # `contains(ref_name, '-')`, which is FALSE for `dev`; udt-build hands
  # softprops only a tag_name, and its defaults are `prerelease: false` and
  # latest.  So whichever finishes last decides, and left alone a nightly dev
  # build would present itself as the newest stable one -- to the registry, and
  # to anyone installing this package by name.
  #
  # Both directions are set explicitly, for the same reason: leaving the stable
  # case alone means it keeps whatever that race happened to leave behind.
  # ---- jbase: the DEFC shared library, built in the licensed container --------
  # jBASE resolves DEFC against a SHARED LIBRARY, where UniData folds its CallC
  # contribution in as an object -- so this links libjbcurl.so against libcurl and
  # jBASE's own headers, and the artifact is os/arch-locked like any native build.
  jbase-binary:
    needs: [source]
    runs-on: [self-hosted, linux, jbase]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/jbase-build@main
        with:
          package: mvx-lang/curl
          artifact: curl

  # ---- mvx: the native extension, one build per architecture ----------------
  # On MVX this package is a native extension and nothing else: build-mvx.sh
  # has mkpkg compile src/mvxcurl.c into LIB/libmvxext_curl.so and stages it
  # with EXPORTS.  It is the toolchain's HTTPS transport -- mvx's own `http`
  # package has no TLS, so without this MVPKG cannot reach the registry at all
  # (mvx#218).  Built natively on both architectures mvx publishes; setup-mvx
  # picks the toolchain by `uname -m', and the asset name uses the same token
  # the mvx installer asks for.  needs: [source] -- see udt-binary.
  mvx-binary:
    needs: [source]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: curl
      # mkpkg is not installed with the toolchain (build-mvx.sh says why), and
      # stamp-manifests.py is how a package states the version it was released as.
      - name: Check out the mvx package tooling
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          path: .mvx-src
          sparse-checkout: |
            scripts
            .github/actions/publish-source
          sparse-checkout-cone-mode: false
      - uses: mvx-lang/mvx/.github/actions/setup-mvx@main
        with:
          version: latest
      - name: Install libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config
      - name: Build + stage the mvx package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"; ARCH="$(uname -m)"; OS="linux"
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="curl-$VER-mvx-$OS-$ARCH-$ENDIAN"
          DIST="$PWD/dist/$BASE"; rm -rf "$DIST"; mkdir -p "$DIST"
          # mkpkg compiles against <mvx-src>/runtime/include.  Point that at the
          # INSTALLED toolchain's headers rather than checking out develop's: the
          # extension must match the runtime it is tested and shipped with, and
          # a runtime refuses a library stamped with a newer ABI than its own.
          mkdir -p .mvx-src/runtime
          ln -sfn "$MVXHOME/include" .mvx-src/runtime/include
          MVX_SRC="$PWD/.mvx-src" MVXBASIC="$(command -v mvx-basic)" sh curl/build-mvx.sh "$DIST"
          # IN-TREE, BOTH MANIFESTS SAY 0.0.0-dev (#23).  Deliberately -- a
          # number committed there can only be stale or coincidentally right,
          # and this step is why it does not have to be either.  Do not bump it
          # before a release; tag, and the tag lands in the artifact.
          python3 .mvx-src/.github/actions/publish-source/stamp-manifests.py "$DIST" "$VER"

          # THE ONE REAL TEST THIS PACKAGE HAS, and it used to live here as a step
          # -- so a tag was the only thing that ever exercised HTTPS, and a pull
          # request was checked by nothing (#25).  It is tests/https-smoke.sh now,
          # called from ci.yml as well.  One script, two callers, no drift.
          sh curl/tests/https-smoke.sh "$DIST"

          tar czf "$BASE.tar.gz" -C "$DIST" .
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish the mvx binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  mark:
    needs: [source, udt-binary, jbase-binary, mvx-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STABLE IS THE ONE THAT IS NOT A PRE-RELEASE.  dev, beta and rc all
          # are; a stable tag is anything with no suffix -- 2.1.0, not
          # 2.1.0-rc1 and not dev.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
